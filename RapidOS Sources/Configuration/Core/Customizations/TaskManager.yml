---
title: Task Manager configuration
description: Enables 'Always on Top' for persistent window priority
actions:
  - !powerShell:
      builds: ['<22000']
      runas: currentUserElevated
      command: >-
        $path = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\TaskManager'; $name = 'Preferences';
        $val = Get-ItemPropertyValue -Path $path -Name $name -EA 0;
        if (!$val) {
          (New-Object -ComObject WScript.Shell).Run('taskmgr.exe', 0, $false) *>$null;
          Start-Sleep -s 3;
          taskkill /f /im taskmgr.exe *>$null;
          Start-Sleep -s 1;
          $val = Get-ItemPropertyValue -Path $path -Name $name -EA 0
        }
        $val[48] = 1;
        Edit-Registry -Path $path -Name $name -Type Binary -Value $val

  - !powerShell:
      builds: ['>=22000']
      runas: currentUserElevated
      oobe: false
      wait: true
      command: >-
        $path = $env:LOCALAPPDATA + '\Microsoft\Windows\TaskManager\settings.json';
        if (!(Test-Path $path)) {
          (New-Object -ComObject WScript.Shell).Run('taskmgr.exe', 0, $false) *>$null;
          Start-Sleep -s 3;
          taskkill /f /im taskmgr.exe *>$null;
          Start-Sleep -s 1
        }
        for ($i = 0; $i -lt 3; $i++) {
          $obj = [IO.File]::ReadAllText($path) | ConvertFrom-Json -EA 0;
          if ($obj) {
            $obj | Add-Member -NotePropertyName 'AlwaysOnTop' -NotePropertyValue $true -Force;
            [IO.File]::WriteAllText($path, ($obj | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false));
            break
          }
          Start-Sleep -m 500
        }

  - !registryValue:
      builds: ['>=22000']
      path: 'HKLM\SOFTWARE\RapidOS\Installation\Deferred'
      value: 'TaskManager'
      type: REG_DWORD
      data: '1'