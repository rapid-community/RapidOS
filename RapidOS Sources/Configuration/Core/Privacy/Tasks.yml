---
title: Telemetry scheduled tasks configuration
description: Disables various telemetry and data collection tasks
actions:
  - !powerShell:
      wait: true
      command: |
        $s = [Activator]::CreateInstance([Type]::GetTypeFromProgID('Schedule.Service'))
        $s.Connect()

        $tasks = @(
          # === Customer Experience Improvement Program (CEIP / SQM) ===
          '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator'
          '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask'
          '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip'
          '\Microsoft\Windows\Customer Experience Improvement Program\BthSQM'

          # === Application Experience & Compatibility ===
          '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
          '\Microsoft\Windows\Application Experience\MareBackup'
          '\Microsoft\Windows\Application Experience\ProgramDataUpdater'
          '\Microsoft\Windows\Application Experience\StartupAppTask'
          '\Microsoft\Windows\Application Experience\AitAgent'
          '\Microsoft\Windows\Application Experience\PcaPatchDbTask'
          '\Microsoft\Windows\Application Experience\PcaWallpaperAppDetect'

          # === Diagnostics & Feedback ===
          '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector'
          '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticResolver'
          '\Microsoft\Windows\Autochk\Proxy'
          '\Microsoft\Windows\Feedback\Siuf\DmClient'
          '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload'

          # === Windows Error Reporting ===
          '\Microsoft\Windows\Windows Error Reporting\QueueReporting'

          # === Device Information ===
          '\Microsoft\Windows\Device Information\Device'
          '\Microsoft\Windows\Device Information\Device User'
        )

        foreach ($task in $tasks) {
          try {
            $t = $s.GetFolder('\').GetTask($task)
            try {$t.Stop(0)} catch {}
            $t.Enabled = $false
          } catch {}
        }