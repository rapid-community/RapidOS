---
title: Windows Update configuration
actions:
  - !powerShell:
      runas: currentUserElevated
      command: |
        # === Pause updates for 10 years ===
        $pause = (Get-Date).AddYears(10).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
        $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
        $reg = 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings'

        Edit-Registry -Path $reg -Name 'PauseFeatureUpdatesStartTime' -Value $today
        Edit-Registry -Path $reg -Name 'PauseFeatureUpdatesEndTime' -Value $pause
        Edit-Registry -Path $reg -Name 'PauseQualityUpdatesStartTime' -Value $today
        Edit-Registry -Path $reg -Name 'PauseQualityUpdatesEndTime' -Value $pause
        Edit-Registry -Path $reg -Name 'PauseUpdatesStartTime' -Value $today
        Edit-Registry -Path $reg -Name 'PauseUpdatesExpiryTime' -Value $pause

  # === Use 'Notify to download' policy ===
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', value: 'AUOptions', type: REG_DWORD, data: '2'}

  # === Disable Reserved Storage for more control over disk space ===
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ReserveManager', value: 'ShippedWithReserves', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ReserveManager', value: 'PassedPolicy', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ReserveManager', value: 'MiscPolicyInfo', type: REG_DWORD, data: '2'}

  # === Prevent updates for DevHome, Outlook and CrossDevice ===
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\DevHomeUpdate', operation: delete}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\OutlookUpdate', operation: delete}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\CrossDeviceUpdate', operation: delete}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Orchestrator\UScheduler\DevHomeUpdate', value: 'workCompleted', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Orchestrator\UScheduler\OutlookUpdate', value: 'workCompleted', type: REG_DWORD, data: '1'}

  # === Disable Microsoft Store autoupdates ===
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore', value: 'AutoDownload', type: REG_DWORD, data: '2', option: 'disable-store-updates'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsStore\WindowsUpdate', value: 'AutoDownload', type: REG_DWORD, data: '2', option: 'disable-store-updates'}