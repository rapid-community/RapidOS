---
title: Configure environment and register PowerShell modules
actions:
  - !powerShell:
      handleExitCodes: {'!0': halt}
      exeDir: true
      wait: true
      command: >-
        .\RapidScripts\EnvSetup.ps1;
        $install = $env:SystemRoot + '\RapidScripts';
        $dest = $env:ProgramFiles + '\WindowsPowerShell\Modules';

        robocopy 'RapidScripts' $install /E /NP /NFL /NDL *>$null;
        icacls $install /grant '*S-1-1-0:(OI)(CI)F' /T /C /Q *>$null;
        icacls ($env:SystemRoot + '\Resources\Themes') /grant '*S-1-1-0:(OI)(CI)RX' /T /C /Q *>$null;

        $k = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey('SOFTWARE\RapidOS'); $a = $k.GetAccessControl();
        $a.AddAccessRule([Security.AccessControl.RegistryAccessRule]::new([Security.Principal.SecurityIdentifier]::new('S-1-1-0'), 'FullControl', 'ContainerInherit, ObjectInherit', 'None', 'Allow'));
        $k.SetAccessControl($a); $k.Close();

        robocopy 'RapidResources\RapidOS Toolbox' ($env:SystemRoot + '\RapidOS Toolbox') /E /NP /NFL /NDL *>$null;
        copy 'RapidResources\RapidOS.theme' ($env:SystemRoot + '\Resources\Themes') -Force *>$null;

        $playbook = $install + '\Playbook';
        mkdir $playbook -Force *>$null;
        gci (pwd) -Filter *.ps1 -File -EA 0 | % {copy $_.FullName ($playbook + '\' + $_.Name) -Force *>$null};

        $src = $install + '\Modules';
        mkdir $dest -Force *>$null;

        gci $src -Directory -EA 0 | % {robocopy $_.FullName ($dest + '\' + $_.Name) /E /NP /NFL /NDL *>$null};
        gci $src -File -EA 0 | ? {$_.Extension -in '.psd1','.psm1'} | % {$p = $dest + '\' + $_.BaseName; mkdir $p -Force *>$null; copy $_.FullName ($p + '\' + $_.Name) -Force *>$null};

        $reg = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment';
        $val = (Get-Item $reg).GetValue('Path', '', 'DoNotExpandEnvironmentNames');
        if (!($val -split ';' -contains $install)) {if ($val) {$v = $install + ';' + $val} else {$v = $install}; Edit-Registry -Path $reg -Name 'Path' -Type ExpandString -Value $v};

        if (!($env:PATH -split ';' -contains $install)) {if ($env:PATH) {$env:PATH = $install + ';' + $env:PATH} else {$env:PATH = $install}};

        if (!($env:PSModulePath -split ';' -contains $dest)) {if ($env:PSModulePath) {$env:PSModulePath += ';' + $dest} else {$env:PSModulePath = $dest}};
        if ((Test-Path $src) -and !($env:PSModulePath -split ';' -contains $src)) {if ($env:PSModulePath) {$env:PSModulePath += ';' + $src} else {$env:PSModulePath = $src}};

        $obj = '[System.Runtime.InteropServices.DllImport(' + [char]34 + 'user32.dll' + [char]34 + ', CharSet=System.Runtime.InteropServices.CharSet.Unicode)] public static extern IntPtr SendMessageTimeout(IntPtr hWnd, uint Msg, IntPtr wParam, string lParam, uint fuFlags, uint uTimeout, out IntPtr lpResult);';
        Add-Type -Name 'W32' -Namespace 'H' -MemberDefinition $obj;
        [H.W32]::SendMessageTimeout(0xffff, 0x1A, [IntPtr]::Zero, 'Environment', 2, 5000, [ref][IntPtr]::Zero) *>$null;

        $global:LASTEXITCODE = 0