---
title: Disable Notifications
actions:
  # === Disable notifications during installation ===
  - !service:
      ignoreErrors: true
      name: "WpnService"
      operation: stop
  - !service:
      ignoreErrors: true
      name: "WpnUserService*"
      operation: stop
  - !service:
      name: "WpnService"
      operation: change
      startup: 4
  - !service:
      name: "WpnUserService*"
      operation: change
      startup: 4