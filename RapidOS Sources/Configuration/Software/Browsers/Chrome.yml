---
title: Chrome installation
actions:
  - !run:
      runas: currentUserElevated
      oobe: false
      option: 'install-chrome'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Software Install-Chrome"'

  - !run:
      runas: currentUserElevated
      oobe: false
      option: 'install-chrome'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Software Optimize-Chrome"'

  - !run:
      runas: currentUserElevated
      oobe: only
      option: 'install-chrome'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Mode Download -Software Install-Chrome"'

  - !registryValue:
      option: 'install-chrome'
      path: 'HKLM\SOFTWARE\RapidOS\Installation\Deferred\Browser'
      value: 'Chrome'
      type: REG_DWORD
      data: '1'