---
title: Firefox installation
actions:
  - !run:
      runas: currentUserElevated
      oobe: false
      option: 'install-firefox'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Software Install-Firefox"'

  - !run:
      runas: currentUserElevated
      oobe: false
      option: 'install-firefox'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Software Optimize-Firefox"'

  - !run:
      runas: currentUserElevated
      oobe: only
      option: 'install-firefox'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Mode Download -Software Install-Firefox"'

  - !registryValue:
      option: 'install-firefox'
      path: 'HKLM\SOFTWARE\RapidOS\Installation\Deferred\Browser'
      value: 'Firefox'
      type: REG_DWORD
      data: '1'