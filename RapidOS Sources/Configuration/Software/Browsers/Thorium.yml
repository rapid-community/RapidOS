---
title: Thorium installation
actions:
  - !run:
      runas: currentUserElevated
      oobe: false
      option: 'install-thorium'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Software Install-Thorium"'

  - !run:
      runas: currentUserElevated
      oobe: only
      option: 'install-thorium'
      exeDir: true
      wait: true
      exe: 'powershell'
      args: '-EP Bypass -C ".\Software.ps1 -Mode Download -Software Install-Thorium"'

  - !registryValue:
      option: 'install-thorium'
      path: 'HKLM\SOFTWARE\RapidOS\Installation\Deferred\Browser'
      value: 'Thorium'
      type: REG_DWORD
      data: '1'