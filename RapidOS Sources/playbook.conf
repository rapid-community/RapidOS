<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>RapidOS</Name>
    <Username>Rapid Team</Username>
    <Title>Rapid Playbook v1.3</Title>
    <ShortDescription><![CDATA[Streamlining Windows 10 & 11]]></ShortDescription>
    <Description>Rapid Community enhances usability and optimizes the experience without sacrificing stability.&#xD;&#xA;&#xD;&#xA;RapidOS supports 22H2, 23H2, 24H2, 25H2 builds.&#xD;&#xA;&#xD;&#xA;⚠️ It's important to comprehend that after installing this playbook, you can undo it.</Description>
    <Details>Designed to refine Windows functionality and user interaction.</Details>
    <ProgressText>RapidOS is installing necessary components, adjusting settings, and enhancing system speed.</ProgressText>
    <Version>1.3</Version>

    <!-- <ProductCode></ProductCode> -->
    <UseKernelDriver>false</UseKernelDriver>
    <Overhaul>true</Overhaul>
    <SupportsISO>true</SupportsISO>
    <UniqueId>1c420b60-69ff-422d-8386-07d3fc2b40c4</UniqueId>
    <UpgradableFrom>1.1</UpgradableFrom>

    <Git>https://github.com/rapid-community/RapidOS/</Git>
    <Website>https://rapid-community.ru/</Website>
    <DonateLink>https://www.donationalerts.com/c/rapidos/</DonateLink>
    <InstallGuide>https://docs.rapid-community.ru/general-installation/install-rapidos/</InstallGuide>

    <SupportedBuilds>
        <string>19045</string> <!-- Windows 10 22H2 -->
        <string>22621</string> <!-- Windows 11 22H2 -->
        <string>22631</string> <!-- Windows 11 23H2 -->
        <string>26100</string> <!-- Windows 11 24H2 -->
        <string>26200</string> <!-- Windows 11 25H2 -->
    </SupportedBuilds>

    <Requirements>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoTweakware</Requirement>
    </Requirements>

    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>

    <OOBE>
        <Internet>Request</Internet>

        <BulletPoints>
            <BulletPoint
              Icon="Lock"
              Title="Reliability"
              Description="Thoroughly tested to ensure the system is stable for daily use."
            />
            <BulletPoint
              Icon="Privacy"
              Title="Privacy"
              Description="Telemetry and tracking services are disabled to prevent data collection."
            />
            <BulletPoint
              Icon="Rocket"
              Title="Performance"
              Description="Unnecessary apps and bloatware are removed to reduce load and improve speed."
            />
        </BulletPoints>
    </OOBE>

    <FeaturePages>
        <CheckboxPage Description="Please choose the features you'd like to include or exclude in this selection box.">
            <TopLine Text="Select the browser features to configure"/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove MS Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install another browser</Text>
                    <Name>install-browser</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <RadioImagePage CheckDefaultBrowser="true" DependsOn="install-browser" DefaultOption="install-brave" Description="Please select a preferred browser. We can only provide a curated experience for some options.">
            <TopLine Text="This page requires internet connection"/>
            <Options>
                <RadioImageOption>
                    <Text>Brave</Text>
                    <Name>install-brave</Name>
                    <FileName>Brave</FileName>
                    <GradientTopColor>#A33401</GradientTopColor>
                    <GradientBottomColor>#FFC481</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>install-firefox</Name>
                    <FileName>Firefox</FileName>
                    <GradientTopColor>#FFA500</GradientTopColor>
                    <GradientBottomColor>#FF3300</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Thorium</Text>
                    <Name>install-thorium</Name>
                    <FileName>Thorium</FileName>
                    <GradientTopColor>#5A9CEB</GradientTopColor>
                    <GradientBottomColor>#004A9E</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Chrome</Text>
                    <Name>install-chrome</Name>
                    <FileName>Chrome</FileName>
                    <GradientTopColor>#66BB6A</GradientTopColor>
                    <GradientBottomColor>#2E7D32</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="Privacy tests 🔒" Link="https://privacytests.org/"/>
        </RadioImagePage>

        <CheckboxPage Description="Customize your installation by selecting desired components.">
            <TopLine Text="This page requires internet connection"/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>.NET 3.5</Text>
                    <Name>install-net3.5</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>DirectX</Text>
                    <Name>install-directx</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>VCRedist</Text>
                    <Name>install-vcredist</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Select the UWP apps you want to uninstall from your system.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove MS Teams</Text>
                    <Name>remove-teams</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Office apps</Text>
                    <Name>remove-office</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Your Phone</Text>
                    <Name>remove-phone</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Tailor your system settings to fit your preferences and improve your experience.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Use RapidOS theme</Text>
                    <Name>apply-theme</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text><![CDATA[Clear Start menu & Taskbar templates]]></Text>
                    <Name>modify-templates</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Activate classic context menu (Win11)</Text>
                    <Name>classic-context-menu</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Microsoft Store updates</Text>
                    <Name>disable-store-updates</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage Description="Tailor your system settings to fit your preferences and improve your experience.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Microsoft Defender</Text>
                    <Name>disable-defender</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable firewall</Text>
                    <Name>disable-firewall</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable location</Text>
                    <Name>disable-location</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable sync</Text>
                    <Name>disable-sync</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>